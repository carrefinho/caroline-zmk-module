# Caroline with a Seeed XIAO SAMD21 Plus (JP1-JP4 bridged C-B).
# Board: seeeduino_xiao. Flash by double-tapping RESET and copying the .uf2 to
# the volume that appears.

CONFIG_INPUT=y

# NAVG 3 is what fits a 200 Hz pass on this board with room to spare (see the
# overlay), and it is still a real median: one outlier in three is dropped.
CONFIG_ZMK_KSCAN_EC_DIRECT_NAVG=3
CONFIG_ZMK_KSCAN_EC_DIRECT_MEDIAN=y

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=n
