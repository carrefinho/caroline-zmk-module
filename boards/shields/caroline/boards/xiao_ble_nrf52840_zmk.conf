# Caroline with a Seeed XIAO nRF52840 Plus (JP1-JP4 bridged A-C).
# Board: xiao_ble//zmk. Flash by double-tapping RESET and copying the .uf2 to
# XIAO-BOOT.

CONFIG_INPUT=y

# Ten strobes on four sense lines. A reference scan every 2 strobes, nearest
# reference: 16 scans a sample, a held key shifts its neighbours on the line
# by about 3 % of a press, idle sd 2.7-2.9. These are the driver defaults,
# stated because this board is where they were chosen.
CONFIG_ZMK_KSCAN_EC_DIRECT_REF_INTERVAL=2
CONFIG_ZMK_KSCAN_EC_DIRECT_REF_INTERPOLATE=n

# 16 scans of 4 channels at ~5 us a conversion: about 0.35 ms a sample, so a
# NAVG 4 pass is ~1.5 ms of the overlay's 4 ms period.
CONFIG_ZMK_KSCAN_EC_DIRECT_NAVG=4
CONFIG_ZMK_KSCAN_EC_DIRECT_CONFIRM_PASSES=2

# Idle tripwire. It raises all ten strobes at once, so a press reads almost
# what it does in the per-key pass: 210-315 on battery. Quiet, hands off, the
# worst reading in a minute is +14, so 70 is a third of the weakest press and
# five times the quiet ceiling.
CONFIG_ZMK_KSCAN_EC_DIRECT_TRIPWIRE=y
CONFIG_ZMK_KSCAN_EC_DIRECT_TRIPWIRE_THRESHOLD=70
CONFIG_ZMK_KSCAN_EC_DIRECT_TRIPWIRE_TRACK_SHIFT=8

# Measured with these settings, BLE connected: 42 uA idle, 219 uA in the 10 s
# after a key, about 0.6 mA typing at 55 wpm, 334 uA with a key held.
CONFIG_ZMK_KSCAN_EC_DIRECT_TW_HOLD_WATCH=y

# The driver owns the SAADC, so the board's battery divider driver is disabled
# in the overlay. The scan thread reads the divider after a tripwire pass and
# the overlay's ec_battery node hands ZMK the cached value.
CONFIG_ZMK_BATTERY_REPORTING=y

CONFIG_ZMK_USB=y

# Deep sleep stays off: an EC key cannot wake the SoC from System OFF, and
# the tripwire is already the low-power state.
CONFIG_ZMK_SLEEP=n

# The idle figure above needs the console off...
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_ZMK_USB_LOGGING=n

# ...and the XIAO's unused QSPI flash in deep power-down, which is a module of
# its own: https://github.com/carrefinho/zmk-feature-xiao-ble-qspi-suspend
