# Caroline with a Seeed XIAO RP2040 Plus (JP1-JP4 bridged A-C).
# Board: xiao_rp2040//zmk. Flash by holding BOOT, tapping RESET and copying the
# .uf2 to the RPI-RP2 volume.

CONFIG_INPUT=y

CONFIG_ZMK_KSCAN_EC_DIRECT_NAVG=4

# Plain mean of the four, not the median. This converter throws no wild
# samples, and on a noisy USB supply the mean reads idle sd 0.71 of the
# median's. On a clean supply the two are the same.
CONFIG_ZMK_KSCAN_EC_DIRECT_MEAN=y

CONFIG_ZMK_USB=y
